name: Terraform Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: '1.9.8'

jobs:

  # =====================================================
  # FEATURE BRANCH / MAIN
  # TERRAFORM PLAN
  # =====================================================

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:

      # -----------------------------
      # Checkout Code
      # -----------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # -----------------------------
      # Install Terraform
      # -----------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # -----------------------------
      # Azure Login
      # -----------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # -----------------------------
      # Select Environment
      # Feature -> DEV
      # Main    -> PROD
      # -----------------------------
      - name: Select Terraform Environment
        id: environment
        shell: bash
        run: |

          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "TF_DIR=environment/prod" >> "$GITHUB_OUTPUT"
            echo "Running Terraform for PROD"

          else
            echo "TF_DIR=environment/dev" >> "$GITHUB_OUTPUT"
            echo "Running Terraform for DEV"
          fi

      # -----------------------------
      # Terraform Init
      # -----------------------------
      - name: Terraform Init
        working-directory: ${{ steps.environment.outputs.TF_DIR }}
        run: terraform init

      # -----------------------------
      # Terraform Format
      # -----------------------------
      - name: Terraform Format Check
        working-directory: ${{ steps.environment.outputs.TF_DIR }}
        run: terraform fmt -check -recursive

      # -----------------------------
      # Terraform Validate
      # -----------------------------
      - name: Terraform Validate
        working-directory: ${{ steps.environment.outputs.TF_DIR }}
        run: terraform validate

      # -----------------------------
      # Terraform Plan
      # -----------------------------
      - name: Terraform Plan
        working-directory: ${{ steps.environment.outputs.TF_DIR }}
        run: terraform plan -out=tfplan

      # -----------------------------
      # Save Plan
      # -----------------------------
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: ${{ steps.environment.outputs.TF_DIR }}/tfplan


  # =====================================================
  # PRODUCTION APPLY
  # ONLY MAIN BRANCH
  # =====================================================

  terraform-apply:
    name: Terraform Apply - Production
    runs-on: ubuntu-latest

    needs: terraform-plan

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: production

    steps:

      # -----------------------------
      # Checkout
      # -----------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # -----------------------------
      # Setup Terraform
      # -----------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # -----------------------------
      # Azure Login
      # -----------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # -----------------------------
      # Download Plan
      # -----------------------------
      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: environment/prod

      # -----------------------------
      # Terraform Init
      # -----------------------------
      - name: Terraform Init
        working-directory: environment/prod
        run: terraform init

      # -----------------------------
      # Terraform Apply
      # -----------------------------
      - name: Terraform Apply
        working-directory: environment/prod
        run: terraform apply -auto-approve tfplan